name: フィーチャー ブランチを push した際のアクション
on:
  push:
    branches:
      - '*'
      - '!main'
jobs:
  build:
    name: ソースコードの検証
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '17'
    steps:
      - name: チェックアウトします。
        uses: actions/checkout@v2
      - name: Node.js バージョン ${{ env.NODE_VERSION }} を使用します。
        uses: actions/setup-node@v2
        with:
          cache: yarn
          node-version: ${{ env.NODE_VERSION }}
      - name: プロジェクトの依存関係を解決します。
        run: yarn install
      - name: ソースコードの構文検証をします。
        run: yarn run lint:fix
